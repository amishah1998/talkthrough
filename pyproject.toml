[project]
name = "page-walkthrough"
version = "0.1.0"
description = "Turn any HTML page or PDF into a narrated walkthrough video of itself"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Karan Bansal" }]
dependencies = [
  "pillow>=10",
  "websockets>=12",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
plan = ["anthropic>=0.60"]
local = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
all = ["anthropic>=0.60", "kokoro-onnx>=0.4", "soundfile>=0.12"]

[project.scripts]
page-walkthrough = "page_walkthrough.cli:main"

[project.urls]
Homepage = "https://github.com/karanb192/page-walkthrough"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
