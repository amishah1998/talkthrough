[project]
name = "talkthrough"
version = "0.1.2"
description = "Turn any HTML page or PDF into a narrated walkthrough video of itself"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ami Shah" }, { name = "Karan Bansal" }]
keywords = ["pdf", "html", "video", "walkthrough", "narration", "text-to-speech", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Video",
  "Environment :: Console",
]
dependencies = [
  "pillow>=10",
  "websockets>=12",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
plan = ["anthropic>=0.60"]
local = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
all = ["anthropic>=0.60", "kokoro-onnx>=0.4", "soundfile>=0.12"]

[project.scripts]
talkthrough = "talkthrough.cli:main"

[project.urls]
Homepage = "https://github.com/amishah1998/talkthrough"
Issues = "https://github.com/amishah1998/talkthrough/issues"

[tool.hatch.build.targets.sdist]
exclude = ["docs", "tests", ".github"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
