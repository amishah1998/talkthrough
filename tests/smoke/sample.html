<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smoke test report</title>
<style>
  body { font: 18px/1.5 sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1d1d1b; background: #fff; }
  h1 { font-size: 32px; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ccc; padding: 6px 10px; }
  .card { background: #f4f1ea; border-radius: 12px; padding: 4px 16px; }
</style>
</head>
<body>
<h1>Smoke test report</h1>
<p>A fictional page used by the test suite. Three findings and one decision.</p>
<h2>Finding one</h2>
<p>Usage doubled while cost per request fell by half.</p>
<table>
  <tr><th>Quarter</th><th>Requests</th></tr>
  <tr><td>Q1</td><td>100</td></tr>
  <tr><td>Q2</td><td>200</td></tr>
</table>
<div class="card"><h2>Decision</h2><p>Keep the current plan and review again next quarter.</p></div>
</body>
</html>
